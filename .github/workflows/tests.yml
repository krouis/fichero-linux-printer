name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install real CUPS rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cups cups-client cups-filters ghostscript
      - name: Install locked Python dependencies
        run: uv sync --locked --group test
      - name: Validate scripts and PPD
        run: |
          sh -n scripts/prepare.sh scripts/install.sh resources/backend
          cupstestppd -q resources/FICHERO-D11s.ppd
      - name: Run mocked backend and real rendering tests
        run: uv run --no-sync python -m pytest -q
      - name: Build package
        run: uv build
