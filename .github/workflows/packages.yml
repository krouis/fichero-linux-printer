name: Debian package and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cups cups-client cups-filters ghostscript
      - name: Test Python and validate scripts
        run: |
          uv sync --locked --group test
          uv run --no-sync python -m pytest -q
          sh -n scripts/*.sh packaging/debian/* packaging/test-installed.sh resources/backend
          cupstestppd -q resources/FICHERO-D11s.ppd
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}'
          PY
      - name: Build Ubuntu 24.04 amd64 package
        run: sh scripts/build-deb.sh
      - name: Test package lifecycle offline in disposable Ubuntu
        run: sh scripts/test-deb.sh dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-amd64
          path: dist
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS \
            --verify-tag --title "FICHERO Linux Printer $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
